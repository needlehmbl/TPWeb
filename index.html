<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELP News</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="/"><img src="./logo.jpeg" alt="" width="120px"/></a>

      <div class="inputSearch desktop">
        <form id="searchForm">
          <input type="text" placeholder="Search..." id = "searchInput"/>
          <span><i class="fa-solid fa-search" id="searchBtn"></i></span>
        </form>
      </div>
      <nav class="desktop">
        <ul>
            <li onclick="Search('Sports')">Sports</li>
            <li onclick="Search('Tech')">Tech</li>
            <li onclick="Search('Food')">Food</li>
            <li onclick="Search('Movies')">Movies</li>
            <li onclick="Search('Business')">Business</li>
        </ul>
      </nav>

      <div class="menuBtn">
        <i class="fa-solid fa-bars"></i>
      </div>

      <div class="mobile hidden">
        <nav>
          <ul>
            <li onclick="Search('Sports'), Hide()">Sports</li>
            <li onclick="Search('Tech'), Hide()">Tech</li>
            <li onclick="Search('Food'), Hide()">Food</li>
            <li onclick="Search('Movies'), Hide()">Movies</li>
            <li onclick="Search('Business'), Hide()">Business</li>
          </ul>
        </nav>
        <div class="inputSearch">
          <form id="searchFormMobile">
            <input type="text" placeholder="Search..." id = "searchInputMobile"/>
            <span><i class="fa-solid fa-search" id="searchBtnMobile"></i></span>
          </form>
        </div>
      </div>
    </header>
    <video height="150px" loop autoplay>
        <source src="VideoTP.mp4" type="video/mp4">
    </video>
    <main>

    </main>

    <script src="script.js"></script>
  </body>
</html>
